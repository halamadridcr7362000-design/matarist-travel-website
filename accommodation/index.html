<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accommodation in Istanbul | MATARIST</title>
<meta name="description" content="Browse rooms and apartments for rent in Istanbul — students, shared rooms, monthly rentals. Contact MATARIST directly on WhatsApp.">
<link rel="canonical" href="https://mataristtravel.com/accommodation/">
<meta property="og:title" content="Accommodation in Istanbul | MATARIST">
<meta property="og:description" content="Browse rooms and apartments for rent in Istanbul, organized by district.">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#15121b; --surface:#241c30; --surface-2:#2b2138; --surface-3:#332741;
  --gold:#b8955e; --gold-light:#d4b480;
  --text:#f3ede4; --text-muted:#a99bb0; --text-faint:#786a85;
  --border:#362c42; --border-soft:#2d2436;
  --accent:#b8955e; --accent-2:#b8955e; --accent-soft:rgba(184,149,94,0.14);
  --radius-lg:18px; --radius-md:12px; --radius-sm:8px;
  --shadow-card:0 10px 30px rgba(0,0,0,0.35);
  --shadow-lift:0 18px 44px rgba(0,0,0,0.45);
}
[data-gender="girls"]{ --accent:#5b2a86; --accent-2:#e8b8cc; --accent-soft:rgba(91,42,134,0.20); }
[data-gender="boys"]{ --accent:#5b7290; --accent-2:#5b7290; --accent-soft:rgba(91,114,144,0.18); }

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
[dir="rtl"] body{font-family:'Cairo','DM Sans',sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:600;letter-spacing:0.01em}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{font-family:'Cairo',sans-serif;font-weight:700}
a{color:inherit}

/* ===== Header ===== */
header{background:rgba(21,18,27,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-soft);padding:16px 5%;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:50}
.logo{display:flex;align-items:baseline;gap:6px;font-weight:700;letter-spacing:0.06em;text-decoration:none;font-size:1.05rem;text-transform:uppercase}
.logo .mark{color:var(--gold)}
.logo .sub{color:var(--text-muted);font-weight:500;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;margin-inline-start:4px}
.header-right{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header nav a{color:var(--text-muted);text-decoration:none;font-size:0.82rem;transition:color 0.2s}
header nav a:hover{color:var(--gold-light)}
.lang-row{display:flex;gap:6px;border:1px solid var(--border);border-radius:20px;padding:3px}
.lang-row button{background:transparent;border:none;color:var(--text-muted);border-radius:16px;padding:5px 12px;font-size:0.72rem;font-weight:600;letter-spacing:0.04em;cursor:pointer;transition:all 0.2s;font-family:inherit}
.lang-row button.active{background:var(--gold);color:#1a1420}

/* ===== Hero ===== */
.hero{position:relative;padding:72px 5% 110px;text-align:center;overflow:hidden;background:
  radial-gradient(ellipse 700px 420px at 50% -10%, rgba(184,149,94,0.16), transparent 60%),
  linear-gradient(180deg, var(--bg) 0%, #1b1724 100%);}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 20% 30%, rgba(184,149,94,0.05) 0, transparent 40%);pointer-events:none}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--gold);font-size:0.72rem;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:18px}
.eyebrow::before,.eyebrow::after{content:"";width:22px;height:1px;background:var(--gold);opacity:0.6}
.hero h1{font-size:clamp(2.1rem,4.4vw,3.2rem);line-height:1.15;margin-bottom:14px;color:var(--text)}
.hero p{color:var(--text-muted);max-width:580px;margin:0 auto;font-size:1rem;line-height:1.7;font-weight:400}

/* ===== Filters ===== */
.filters{max-width:1040px;margin:-56px auto 0;position:relative;z-index:10;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lift);padding:22px;display:flex;gap:12px;flex-wrap:wrap}
.filters .field{flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px}
.filters label{font-size:0.68rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-faint)}
.filters select,.filters input{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:11px 13px;font-family:inherit;font-size:0.88rem;outline:none;transition:border-color 0.2s,background 0.2s}
.filters select:focus,.filters input:focus{border-color:var(--gold);background:var(--surface-3)}
.filters select{cursor:pointer}
.filters input::placeholder{color:var(--text-faint)}
.filters .field.action{flex:0 0 auto;justify-content:flex-end}
.filters button{background:var(--gold);border:none;color:#1a1420;font-weight:700;font-size:0.88rem;padding:11px 26px;border-radius:var(--radius-sm);cursor:pointer;transition:background 0.2s,transform 0.2s;white-space:nowrap}
.filters button:hover{background:var(--gold-light);transform:translateY(-1px)}

/* ===== Content ===== */
.wrap{max-width:1180px;margin:0 auto;padding:56px 5% 40px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:8px}
.section-head h2{font-size:1.5rem;color:var(--text)}
.result-count{color:var(--text-faint);font-size:0.85rem}
#map{height:320px;border-radius:var(--radius-lg);margin-bottom:40px;border:1px solid var(--border);overflow:hidden;filter:saturate(0.85) brightness(0.92)}
.leaflet-popup-content-wrapper{background:var(--surface);color:var(--text);border-radius:var(--radius-sm)}
.leaflet-popup-content a{color:var(--gold-light);text-decoration:none;font-weight:600;font-size:0.85rem}
.leaflet-popup-tip{background:var(--surface)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;text-decoration:none;color:inherit;display:block;transition:transform 0.3s ease,box-shadow 0.3s ease,border-color 0.3s ease;position:relative}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-card);border-color:var(--border)}
.card .accent-bar{height:3px;background:var(--accent);width:100%}
.card .img-wrap{position:relative;aspect-ratio:4/3;background:var(--surface-2);overflow:hidden}
.card .img-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.5s ease}
.card:hover .img-wrap img{transform:scale(1.06)}
.card .img-wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(to top, rgba(21,18,27,0.65) 0%, transparent 45%)}
.card .gender-badge{position:absolute;top:12px;inset-inline-start:12px;background:var(--accent-soft);border:1px solid var(--accent);color:var(--text);backdrop-filter:blur(6px);font-size:0.66rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;padding:4px 10px;border-radius:20px;z-index:2}
.card .type-badge{position:absolute;bottom:10px;inset-inline-start:12px;background:rgba(21,18,27,0.72);color:var(--text-muted);font-size:0.68rem;font-weight:600;padding:3px 10px;border-radius:20px;z-index:2;text-transform:capitalize}
.card-body{padding:16px 18px 18px}
.card .district{color:var(--text-faint);font-size:0.76rem;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:4px}
.card h3{font-family:'DM Sans',sans-serif;font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:10px;line-height:1.35}
.card .price-row{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--border-soft);padding-top:12px}
.card .price{color:var(--gold-light);font-weight:700;font-size:1.15rem}
.card .price small{color:var(--text-faint);font-weight:400;font-size:0.72rem;margin-inline-start:4px}
.card .arrow{color:var(--text-faint);transition:transform 0.25s,color 0.25s}
.card:hover .arrow{color:var(--gold);transform:translateX(3px)}
[dir="rtl"] .card:hover .arrow{transform:translateX(-3px)}

.empty{text-align:center;color:var(--text-faint);padding:70px 20px;font-size:0.95rem}

footer{text-align:center;padding:40px 20px;color:var(--text-faint);font-size:0.82rem;border-top:1px solid var(--border-soft);margin-top:40px}
footer a{color:var(--gold);text-decoration:none;font-weight:600}

@media(max-width:640px){
  .filters{flex-direction:column;margin-top:-36px}
  .filters .field.action{width:100%}
  .filters button{width:100%}
  .hero{padding:56px 6% 90px}
}
</style>
</head>
<body>

<header>
  <a class="logo" href="/"><span class="mark">MATARIST</span><span class="sub" data-i18n="brand">Accommodation</span></a>
  <div class="header-right">
    <nav><a href="/" data-i18n="back_home">&larr; Back to MATARIST</a></nav>
    <div class="lang-row">
      <button data-lang="en" onclick="setLang('en')">EN</button>
      <button data-lang="ar" onclick="setLang('ar')">AR</button>
      <button data-lang="tr" onclick="setLang('tr')">TR</button>
    </div>
  </div>
</header>

<section class="hero">
  <span class="eyebrow" data-i18n="eyebrow">Boutique Stays in Istanbul</span>
  <h1 data-i18n="hero_title">Rooms & Apartments in Istanbul</h1>
  <p data-i18n="hero_sub">Browse available rooms, shared accommodation and apartments — organized by district. Contact us directly on WhatsApp.</p>
</section>

<div class="filters">
  <div class="field">
    <label data-i18n="f_district_label">District</label>
    <select id="f-district"><option value="" data-i18n="f_all_districts">All districts</option></select>
  </div>
  <div class="field">
    <label data-i18n="f_type_label">Room type</label>
    <select id="f-type">
      <option value="" data-i18n="f_all_types">All room types</option>
      <option value="single" data-i18n="type_single">Single room</option>
      <option value="double" data-i18n="type_double">Double room</option>
      <option value="shared" data-i18n="type_shared">Shared room</option>
      <option value="apartment" data-i18n="type_apartment">Entire apartment</option>
    </select>
  </div>
  <div class="field">
    <label data-i18n="f_price_label">Max price</label>
    <input type="number" id="f-max-price" data-i18n-ph="f_max_price" placeholder="Max price (TRY)">
  </div>
  <div class="field action">
    <button onclick="applyFilters()" data-i18n="f_search">Search</button>
  </div>
</div>

<div class="wrap">
  <div id="map"></div>
  <div class="section-head">
    <h2 data-i18n="listings_heading">Available Listings</h2>
    <span class="result-count" id="result-count"></span>
  </div>
  <div id="grid" class="grid"><div class="empty" data-i18n="loading">Loading listings…</div></div>
</div>

<footer>MATARIST Travel &middot; Istanbul &middot; <a href="https://wa.me/905451218167">WhatsApp</a></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const translations = {
  en:{brand:"Accommodation",back_home:"← Back to MATARIST",eyebrow:"Boutique Stays in Istanbul",hero_title:"Rooms & Apartments in Istanbul",hero_sub:"Browse available rooms, shared accommodation and apartments — organized by district. Contact us directly on WhatsApp.",f_district_label:"District",f_type_label:"Room type",f_price_label:"Max price",f_all_districts:"All districts",f_all_types:"All room types",type_single:"Single room",type_double:"Double room",type_shared:"Shared room",type_apartment:"Entire apartment",f_max_price:"Max price (TRY)",f_search:"Search",listings_heading:"Available Listings",loading:"Loading listings…",no_results:"No listings match your search.",rented:"Rented",per_month:"/month",girls_badge:"Women Only",boys_badge:"Men Only",result_count:"{n} listings"},
  ar:{brand:"سكن",back_home:"← رجوع إلى ماتاريست",eyebrow:"إقامة راقية في إسطنبول",hero_title:"غرف وشقق للإيجار في إسطنبول",hero_sub:"تصفح الغرف والشقق المتاحة — مصنفة حسب المنطقة. تواصل معنا مباشرة عبر واتساب.",f_district_label:"المنطقة",f_type_label:"نوع الغرفة",f_price_label:"أقصى سعر",f_all_districts:"كل المناطق",f_all_types:"كل أنواع الغرف",type_single:"غرفة مفردة",type_double:"غرفة مزدوجة",type_shared:"غرفة مشتركة",type_apartment:"شقة كاملة",f_max_price:"أقصى سعر (ليرة)",f_search:"بحث",listings_heading:"السكنات المتاحة",loading:"جاري تحميل السكنات…",no_results:"لا توجد سكنات مطابقة.",rented:"مؤجرة",per_month:"/شهرياً",girls_badge:"للسيدات فقط",boys_badge:"للرجال فقط",result_count:"{n} سكن متاح"},
  tr:{brand:"Konaklama",back_home:"← MATARIST'e dön",eyebrow:"İstanbul'da Butik Konaklama",hero_title:"İstanbul'da Oda ve Daireler",hero_sub:"Mevcut odaları ve daireleri semte göre inceleyin. Bizimle doğrudan WhatsApp'tan iletişime geçin.",f_district_label:"Semt",f_type_label:"Oda tipi",f_price_label:"Maks. fiyat",f_all_districts:"Tüm semtler",f_all_types:"Tüm oda tipleri",type_single:"Tek kişilik oda",type_double:"Çift kişilik oda",type_shared:"Paylaşımlı oda",type_apartment:"Müstakil daire",f_max_price:"Maks. fiyat (TRY)",f_search:"Ara",listings_heading:"Mevcut İlanlar",loading:"İlanlar yükleniyor…",no_results:"Aramanızla eşleşen ilan yok.",rented:"Kiralandı",per_month:"/ay",girls_badge:"Sadece Kadın",boys_badge:"Sadece Erkek",result_count:"{n} ilan"}
};
function setLang(lang){
  localStorage.setItem('acc_lang', lang);
  document.getElementById('html-root').lang = lang;
  document.getElementById('html-root').dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{ const k=el.getAttribute('data-i18n'); if(translations[lang][k]) el.textContent = translations[lang][k]; });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ const k=el.getAttribute('data-i18n-ph'); if(translations[lang][k]) el.placeholder = translations[lang][k]; });
  document.querySelectorAll('.lang-row button').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
  window.currentLang = lang;
  renderGrid();
}

let allListings = [];
let map, markersLayer;

// Pure presentation logic — derives a visual theme from the listing's
// existing genderPolicy free-text field. No new data field, no stored
// listing is changed; this only decides which CSS accent variables apply.
function genderTheme(genderPolicy){
  const g = String(genderPolicy || '').toLowerCase();
  if(/female|girl|women|woman/.test(g)) return 'girls';
  if(/\bmale\b|\bboys?\b|\bmen\b/.test(g)) return 'boys';
  return 'neutral';
}

async function loadListings(){
  try{
    const res = await fetch('/.netlify/functions/accommodation-listings');
    const data = await res.json();
    allListings = data.listings || [];
  }catch(e){ allListings = []; }
  populateDistricts();
  renderGrid();
  renderMap();
}

function populateDistricts(){
  const sel = document.getElementById('f-district');
  const districts = [...new Set(allListings.map(l=>l.district).filter(Boolean))].sort();
  districts.forEach(d=>{
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    sel.appendChild(opt);
  });
}

function filteredListings(){
  const district = document.getElementById('f-district').value;
  const type = document.getElementById('f-type').value;
  const maxPrice = parseFloat(document.getElementById('f-max-price').value) || Infinity;
  return allListings.filter(l=>{
    if(l.status === 'rented') return false; // rented listings don't show in default results
    if(district && l.district !== district) return false;
    if(type && l.roomType !== type) return false;
    if(l.monthlyRent > maxPrice) return false;
    return true;
  });
}

function applyFilters(){ renderGrid(); }

function renderGrid(){
  const lang = window.currentLang || 'en';
  const t = translations[lang];
  const grid = document.getElementById('grid');
  const items = filteredListings();
  const countEl = document.getElementById('result-count');
  if(countEl) countEl.textContent = items.length ? t.result_count.replace('{n}', items.length) : '';
  if(!items.length){
    grid.innerHTML = `<div class="empty">${t.no_results}</div>`;
    return;
  }
  grid.innerHTML = items.map(l=>{
    const photo = l.photos && l.photos[0] ? `/.netlify/functions/accommodation-listings?photo=${encodeURIComponent(l.photos[0])}` : '';
    const theme = genderTheme(l.genderPolicy);
    const genderBadge = theme === 'girls' ? `<span class="gender-badge">${t.girls_badge}</span>` : theme === 'boys' ? `<span class="gender-badge">${t.boys_badge}</span>` : '';
    const typeLabel = t['type_'+l.roomType] || l.roomType || '';
    return `<a class="card" data-gender="${theme}" href="/accommodation/${l.slug}">
      <div class="accent-bar"></div>
      <div class="img-wrap">
        ${genderBadge}
        <img src="${photo}" loading="lazy" alt="${escapeHtml(l.title)}" onerror="this.style.display='none'">
        <span class="type-badge">${escapeHtml(typeLabel)}</span>
      </div>
      <div class="card-body">
        <div class="district">${escapeHtml(l.district||'')}</div>
        <h3>${escapeHtml(l.title||'')}</h3>
        <div class="price-row">
          <span class="price">${l.monthlyRent||''} ${escapeHtml(l.currency||'TRY')}<small>${t.per_month}</small></span>
          <i class="fa-solid fa-arrow-right arrow"></i>
        </div>
      </div>
    </a>`;
  }).join('');
}

function renderMap(){
  if(!map){
    map = L.map('map').setView([41.0082,28.9784],11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
    markersLayer = L.layerGroup().addTo(map);
  }
  markersLayer.clearLayers();
  allListings.filter(l=>typeof l.lat==='number' && typeof l.lng==='number' && l.status!=='rented').forEach(l=>{
    const m = L.marker([l.lat,l.lng]).addTo(markersLayer);
    m.bindPopup(`<a href="/accommodation/${l.slug}">${escapeHtml(l.title)}</a>`);
  });
}

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const savedLang = localStorage.getItem('acc_lang') || 'en';
setLang(savedLang);
loadListings();
</script>
</body>
</html>
